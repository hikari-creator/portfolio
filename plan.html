
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --ink: #1a1a18;
    --ink2: #4a4a44;
    --ink3: #8a8a80;
    --paper: #fafaf7;
    --surface: #f2f2ee;
    --border: #e0e0d8;
    --green: #2d7a4f;
    --green-bg: #e8f5ee;
    --amber: #a05c00;
    --amber-bg: #fef3e2;
    --red: #c0392b;
    --red-bg: #fdecea;
    --accent: #2d5a8e;
    --accent-bg: #eaf0f8;
    --mono: 'DM Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .app {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 600px;
    padding: 0 0 40px;
  }

  /* Header */
  .header {
    background: var(--ink);
    color: #fff;
    padding: 20px 24px 18px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '¥';
    position: absolute;
    right: 20px;
    top: -10px;
    font-size: 80px;
    font-family: var(--mono);
    font-weight: 500;
    opacity: 0.07;
    line-height: 1;
  }
  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
  }
  .header-sub {
    font-size: 12px;
    opacity: 0.55;
    letter-spacing: 0.05em;
  }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    background: var(--ink);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .tab {
    padding: 10px 6px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border-top: 2px solid transparent;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .tab:hover { color: rgba(255,255,255,0.75); }
  .tab.active {
    color: #fff;
    border-top-color: #fff;
    background: rgba(255,255,255,0.06);
  }

  /* Panels */
  .panel { display: none; padding: 20px 20px 0; }
  .panel.active { display: block; }

  /* Section label */
  .slabel {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 10px;
    margin-top: 22px;
  }
  .slabel:first-child { margin-top: 0; }

  /* Card */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }

  /* Metric grid */
  .mgrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .mcard {
    background: var(--surface);
    border-radius: 8px;
    padding: 12px 14px;
    border: 1px solid var(--border);
  }
  .mcard-label { font-size: 11px; color: var(--ink3); margin-bottom: 4px; letter-spacing: 0.04em; }
  .mcard-val { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--ink); line-height: 1.1; }
  .mcard-sub { font-size: 11px; color: var(--ink3); margin-top: 3px; font-family: var(--mono); }
  .mcard-val.ok { color: var(--green); }
  .mcard-val.warn { color: var(--amber); }
  .mcard-val.bad { color: var(--red); }

  /* Input row */
  .irow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .irow:last-child { border-bottom: none; padding-bottom: 0; }
  .irow:first-child { padding-top: 0; }
  .irow label {
    font-size: 13px;
    color: var(--ink2);
    flex: 1;
    line-height: 1.3;
  }
  .irow input {
    width: 110px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    text-align: right;
    outline: none;
    transition: border-color 0.15s;
  }
  .irow input:focus { border-color: var(--accent); background: #fff; }
  .irow .unit { font-size: 12px; color: var(--ink3); min-width: 22px; text-align: left; }

  /* PL table */
  .pl-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .pl-row:last-child { border-bottom: none; }
  .pl-row.total { font-weight: 700; font-size: 14px; }
  .pl-row.indent { padding-left: 16px; color: var(--ink2); font-size: 12px; }
  .pl-row.bigline { font-size: 15px; padding: 10px 0; }
  .pl-right { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); white-space: nowrap; }
  .pl-pct { font-size: 11px; color: var(--ink3); min-width: 42px; text-align: right; }

  /* Bar */
  .bar-wrap { margin-bottom: 14px; }
  .bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .bar-name { font-size: 13px; color: var(--ink2); }
  .bar-val { font-size: 12px; font-family: var(--mono); font-weight: 500; color: var(--ink); }
  .bar-track { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
  .bar-target { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .bar-hint { font-size: 11px; color: var(--ink3); }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .badge.warn { background: var(--amber-bg); color: var(--amber); }
  .badge.bad { background: var(--red-bg); color: var(--red); }

  /* Mini grid for 2 columns */
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }

  /* Divider */
  .div { border: none; border-top: 1px dashed var(--border); margin: 2px 0; }

  /* Result highlight */
  .result-box {
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .result-box.ok { background: var(--green-bg); }
  .result-box.warn { background: var(--amber-bg); }
  .result-box.bad { background: var(--red-bg); }
  .result-label { font-size: 13px; font-weight: 500; }
  .result-val { font-size: 22px; font-weight: 700; font-family: var(--mono); }
  .result-box.ok .result-label, .result-box.ok .result-val { color: var(--green); }
  .result-box.warn .result-label, .result-box.warn .result-val { color: var(--amber); }
  .result-box.bad .result-label, .result-box.bad .result-val { color: var(--red); }

  /* Tag strip */
  .event-tag {
    display: inline-block;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 4px;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }

  /* Scroll area hint */
  .scroll-hint { font-size: 11px; color: var(--ink3); text-align: center; padding: 6px 0 0; }

  /* 2-col card grid for input */
  .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .col2 { grid-template-columns: 1fr; } }

  .card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 12px;
    border-radius: 2px;
    background: var(--ink);
  }
  .card-title.web::before { background: var(--accent); }
  .card-title.goods::before { background: var(--green); }
  .card-title.common::before { background: var(--ink3); }
</style>

<div class="app">
  <div class="header">
    <div class="header-title">原価管理マスタ</div>
    <div class="header-sub">WEBデザイン（フリーランス）＋ 猫グッズ販売（マルシェ）</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('input')">⚙ 入力設定</button>
    <button class="tab" onclick="showTab('pl')">📊 損益計算書</button>
    <button class="tab" onclick="showTab('web')">💻 WEB案件</button>
    <button class="tab" onclick="showTab('goods')">🐱 猫グッズ</button>
  </div>

  <!-- 入力 -->
  <div id="tab-input" class="panel active">
    <div class="slabel">共通設定（月次）</div>
    <div class="card">
      <div class="card-title common">自分の労働コスト</div>
      <div class="irow"><label>時給（想定）</label><input type="number" id="jikyu" value="2500" oninput="calc()"><span class="unit">円/h</span></div>
      <div class="irow"><label>月間稼働時間</label><input type="number" id="hours" value="160" oninput="calc()"><span class="unit">h</span></div>
      <div class="irow"><label>厚生・福利費（月）</label><input type="number" id="fukuri" value="15000" oninput="calc()"><span class="unit">円</span></div>
    </div>

    <div class="slabel">事業別入力</div>
    <div class="col2">
      <div class="card">
        <div class="card-title web">WEBデザイン</div>
        <div class="irow"><label>月間売上</label><input type="number" id="web-uriage" value="300000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>時間の割合</label><input type="number" id="web-pct" value="60" oninput="calc()"><span class="unit">%</span></div>
        <div class="irow"><label>ツール費</label><input type="number" id="web-tool" value="5000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>広告宣伝費</label><input type="number" id="web-ad" value="10000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>雑費</label><input type="number" id="web-misc" value="5000" oninput="calc()"><span class="unit">円</span></div>
      </div>
      <div class="card">
        <div class="card-title goods">猫グッズ（マルシェ）</div>
        <div class="irow"><label>月間売上</label><input type="number" id="goods-uriage" value="100000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>時間の割合</label><input type="number" id="goods-pct" value="40" oninput="calc()"><span class="unit">%</span></div>
        <div class="irow"><label>材料費</label><input type="number" id="goods-zairyo" value="20000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>販売手数料</label><input type="number" id="goods-fee" value="11" oninput="calc()"><span class="unit">%</span></div>
        <div class="irow"><label>配送料</label><input type="number" id="goods-haisou" value="5000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>広告費</label><input type="number" id="goods-ad" value="5000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>修繕費・雑費</label><input type="number" id="goods-misc" value="3000" oninput="calc()"><span class="unit">円</span></div>
        <div class="irow"><label>減価償却（月割）</label><input type="number" id="goods-dep" value="2000" oninput="calc()"><span class="unit">円</span></div>
      </div>
    </div>
    <div class="scroll-hint">↑ 数値を変えると損益計算書・各原価タブに即時反映されます</div>
  </div>

  <!-- 損益 -->
  <div id="tab-pl" class="panel">
    <div class="slabel">月次サマリー</div>
    <div class="mgrid" id="summary-cards"></div>

    <div class="slabel">原価率チェック</div>
    <div class="card" id="cost-check"></div>

    <div class="slabel">月次損益計算書</div>
    <div class="card" id="pl-table"></div>
  </div>

  <!-- WEB案件 -->
  <div id="tab-web" class="panel">
    <div class="slabel">1案件あたり原価計算</div>
    <div class="card">
      <div class="card-title web">案件情報</div>
      <div class="irow"><label>見積もり金額</label><input type="number" id="proj-price" value="150000" oninput="calcProj()"><span class="unit">円</span></div>
      <div class="irow"><label>作業時間（予定）</label><input type="number" id="proj-hours" value="40" oninput="calcProj()"><span class="unit">h</span></div>
      <div class="irow"><label>外注費</label><input type="number" id="proj-outsource" value="0" oninput="calcProj()"><span class="unit">円</span></div>
    </div>
    <div id="proj-result"></div>
  </div>

  <!-- 猫グッズ -->
  <div id="tab-goods" class="panel">
    <div class="slabel">1商品あたり原価計算</div>
    <div class="card">
      <div class="card-title goods">商品情報</div>
      <div class="irow"><label>販売価格</label><input type="number" id="item-price" value="1500" oninput="calcItem()"><span class="unit">円</span></div>
      <div class="irow"><label>材料費（1個）</label><input type="number" id="item-zairyo" value="300" oninput="calcItem()"><span class="unit">円</span></div>
      <div class="irow"><label>制作時間（1個）</label><input type="number" id="item-hours" value="0.5" step="0.1" oninput="calcItem()"><span class="unit">h</span></div>
      <div class="irow"><label>マルシェ手数料率</label><input type="number" id="item-fee" value="11" oninput="calcItem()"><span class="unit">%</span></div>
      <div class="irow"><label>配送費（1個）</label><input type="number" id="item-haisou" value="500" oninput="calcItem()"><span class="unit">円</span></div>
    </div>
    <div id="item-result"></div>
  </div>
</div>

<script>
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const tabs = ['input','pl','web','goods'];
  document.querySelectorAll('.tab')[tabs.indexOf(name)].classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='pl') renderPL();
  if(name==='web') calcProj();
  if(name==='goods') calcItem();
}

function v(id){ return parseFloat(document.getElementById(id)?.value)||0; }
function yen(n){ return '¥'+Math.round(n).toLocaleString(); }
function pct(n,d){ return d===0?'—':(n/d*100).toFixed(1)+'%'; }
function colorCls(val, target){ return val>=target?'ok': val>=target*0.9?'warn':'bad'; }

function getData(){
  const jikyu=v('jikyu'), hours=v('hours'), fukuri=v('fukuri');
  const totalJinken = jikyu*hours + fukuri;
  const webPctR=v('web-pct')/100, goodsPctR=v('goods-pct')/100;
  const webU=v('web-uriage'), goodsU=v('goods-uriage');
  const totalU=webU+goodsU;
  const webJinken=totalJinken*webPctR, goodsJinken=totalJinken*goodsPctR;
  const goodsZairyo=v('goods-zairyo');
  const webTool=v('web-tool');
  const webGenka=webJinken+webTool;
  const goodsGenka=goodsJinken+goodsZairyo;
  const totalGenka=webGenka+goodsGenka;
  const webSo=webU-webGenka, goodsSo=goodsU-goodsGenka;
  const totalSo=webSo+goodsSo;
  const goodsFeeAmt=goodsU*v('goods-fee')/100;
  const webHanpan=v('web-ad');
  const goodsHanpan=goodsFeeAmt+v('goods-haisou')+v('goods-ad');
  const webMisc=v('web-misc'), goodsMisc=v('goods-misc')+v('goods-dep');
  const totalHanpan=webHanpan+goodsHanpan;
  const totalMisc=webMisc+goodsMisc;
  const eigyo=totalSo-totalHanpan-totalMisc;
  return {totalU,totalJinken,goodsZairyo,webTool,totalGenka,webGenka,goodsGenka,
    totalSo,webSo,goodsSo,goodsFeeAmt,webHanpan,goodsHanpan,
    webMisc,goodsMisc,totalHanpan,totalMisc,eigyo,
    webU,goodsU,webJinken,goodsJinken};
}

function calc(){
  const d=getData();
  const soRitsu=d.totalU?d.totalSo/d.totalU*100:0;
  const eigyoRitsu=d.totalU?d.eigyo/d.totalU*100:0;
  const scEl=document.getElementById('summary-cards');
  if(scEl) renderSummary(d,soRitsu,eigyoRitsu);
  const plEl=document.getElementById('pl-table');
  if(plEl) renderPL();
  const ccEl=document.getElementById('cost-check');
  if(ccEl) renderCostCheck(d);
}

function renderSummary(d,soRitsu,eigyoRitsu){
  const sc=document.getElementById('summary-cards');
  sc.innerHTML=`
    <div class="mcard">
      <div class="mcard-label">月間売上合計</div>
      <div class="mcard-val">${yen(d.totalU)}</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">粗利益</div>
      <div class="mcard-val ${colorCls(soRitsu,47)}">${yen(d.totalSo)}</div>
      <div class="mcard-sub">粗利率 ${soRitsu.toFixed(1)}%</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">営業利益</div>
      <div class="mcard-val ${d.eigyo>=0?'ok':'bad'}">${yen(d.eigyo)}</div>
      <div class="mcard-sub">利益率 ${eigyoRitsu.toFixed(1)}%</div>
    </div>
    <div class="mcard">
      <div class="mcard-label">人件費（自分）</div>
      <div class="mcard-val">${yen(d.totalJinken)}</div>
      <div class="mcard-sub">${pct(d.totalJinken,d.totalU)}</div>
    </div>
  `;
}

function renderCostCheck(d){
  const jinmat=d.totalJinken+d.goodsZairyo;
  const jp=d.totalU?jinmat/d.totalU*100:0;
  const sp=d.totalU?d.totalSo/d.totalU*100:0;
  const jColor=jp<=53?'#2d7a4f':jp<=60?'#a05c00':'#c0392b';
  const sColor=sp>=47?'#2d7a4f':'#a05c00';
  const badgeCls=jp<=53?'ok':jp<=60?'warn':'bad';
  const badgeText=jp<=53?'目標達成':'超過';
  document.getElementById('cost-check').innerHTML=`
    <div class="bar-wrap">
      <div class="bar-head">
        <span class="bar-name">人件費 ＋ 材料費　<span class="badge ${badgeCls}">${badgeText}</span></span>
        <span class="bar-val">${jp.toFixed(1)}%（目標 ≦ 53%）</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(jp,100)}%;background:${jColor}"></div></div>
    </div>
    <div class="bar-wrap" style="margin-top:12px">
      <div class="bar-head">
        <span class="bar-name">粗利益率</span>
        <span class="bar-val">${sp.toFixed(1)}%（目標 ≧ 47%）</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(sp,100)}%;background:${sColor}"></div></div>
    </div>
  `;
}

function renderPL(){
  const d=getData();
  const soRitsu=d.totalU?d.totalSo/d.totalU*100:0;
  const eigyoRitsu=d.totalU?d.eigyo/d.totalU*100:0;
  const soColor=soRitsu>=47?'var(--green)':'var(--amber)';
  const eigyoColor=d.eigyo>=0?'var(--green)':'var(--red)';
  renderSummary(d,soRitsu,eigyoRitsu);
  renderCostCheck(d);
  document.getElementById('pl-table').innerHTML=`
    <div class="pl-row total bigline">
      <span>売上高</span>
      <div class="pl-right"><span>${yen(d.totalU)}</span><span class="pl-pct">100%</span></div>
    </div>
    <div class="pl-row indent"><span>WEBデザイン</span><span>${yen(d.webU)}</span></div>
    <div class="pl-row indent"><span>猫グッズ</span><span>${yen(d.goodsU)}</span></div>
    <hr class="div">
    <div class="pl-row total">
      <span>原価合計</span>
      <div class="pl-right"><span>${yen(d.totalGenka)}</span><span class="pl-pct">${pct(d.totalGenka,d.totalU)}</span></div>
    </div>
    <div class="pl-row indent"><span>人件費（自分・厚生含）</span><span>${yen(d.totalJinken)}</span></div>
    <div class="pl-row indent"><span>材料費</span><span>${yen(d.goodsZairyo)}</span></div>
    <div class="pl-row indent"><span>ツール費</span><span>${yen(d.webTool)}</span></div>
    <hr class="div">
    <div class="pl-row total bigline" style="color:${soColor}">
      <span>粗利益</span>
      <div class="pl-right"><span>${yen(d.totalSo)}</span><span class="pl-pct" style="color:${soColor}">${soRitsu.toFixed(1)}%</span></div>
    </div>
    <hr class="div">
    <div class="pl-row total">
      <span>販売費・一般管理費</span>
      <div class="pl-right"><span>${yen(d.totalHanpan+d.totalMisc)}</span><span class="pl-pct">${pct(d.totalHanpan+d.totalMisc,d.totalU)}</span></div>
    </div>
    <div class="pl-row indent"><span>販売手数料（マルシェ）</span><span>${yen(d.goodsFeeAmt)}</span></div>
    <div class="pl-row indent"><span>広告宣伝費</span><span>${yen(d.webHanpan+v('goods-ad'))}</span></div>
    <div class="pl-row indent"><span>配送料</span><span>${yen(v('goods-haisou'))}</span></div>
    <div class="pl-row indent"><span>雑費・修繕費</span><span>${yen(d.webMisc+v('goods-misc'))}</span></div>
    <div class="pl-row indent"><span>減価償却</span><span>${yen(v('goods-dep'))}</span></div>
    <hr class="div">
    <div class="pl-row total bigline" style="color:${eigyoColor}">
      <span>営業利益</span>
      <div class="pl-right"><span>${yen(d.eigyo)}</span><span class="pl-pct" style="color:${eigyoColor}">${eigyoRitsu.toFixed(1)}%</span></div>
    </div>
  `;
}

function calcProj(){
  const price=v('proj-price'), phours=v('proj-hours'), outsource=v('proj-outsource');
  const jikyu=v('jikyu'), fukuri=v('fukuri'), totalHours=v('hours');
  const hRate=jikyu+(totalHours>0?fukuri/totalHours:0);
  const jinken=hRate*phours;
  const genka=jinken+outsource;
  const soUri=price-genka;
  const hanpan=price*0.10;
  const eigyo=price-genka-hanpan-v('web-misc');
  const soR=price?soUri/price*100:0;
  const eigyoR=price?eigyo/price*100:0;
  const soBox=soR>=47?'ok':soR>=30?'warn':'bad';
  const eigBox=eigyo>=0?'ok':'bad';
  document.getElementById('proj-result').innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-title web">原価明細</div>
      <div class="pl-row total"><span>見積もり金額</span><div class="pl-right"><span>${yen(price)}</span><span class="pl-pct">100%</span></div></div>
      <div class="pl-row indent"><span>人件費（${phours}h × ¥${Math.round(hRate).toLocaleString()}）</span><span>${yen(jinken)}</span></div>
      <div class="pl-row indent"><span>外注費</span><span>${yen(outsource)}</span></div>
      <hr class="div">
      <div class="pl-row total"><span>製造原価</span><div class="pl-right"><span>${yen(genka)}</span><span class="pl-pct">${pct(genka,price)}</span></div></div>
    </div>
    <div class="g2">
      <div class="result-box ${soBox}">
        <div>
          <div class="result-label">案件粗利</div>
          <div style="font-size:11px;opacity:0.8;margin-top:1px">${soR.toFixed(1)}%</div>
        </div>
        <div class="result-val">${yen(soUri)}</div>
      </div>
      <div class="result-box ${eigBox}">
        <div>
          <div class="result-label">営業利益（概算）</div>
          <div style="font-size:11px;opacity:0.8;margin-top:1px">${eigyoR.toFixed(1)}%</div>
        </div>
        <div class="result-val">${yen(eigyo)}</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--ink3);margin-top:8px">※ 実際の時給（厚生費込）= ¥${Math.round(hRate).toLocaleString()}/h</div>
  `;
}

function calcItem(){
  const price=v('item-price'), zairyo=v('item-zairyo'), ihours=v('item-hours');
  const fee=v('item-fee'), haisou=v('item-haisou');
  const jikyu=v('jikyu'), fukuri=v('fukuri'), totalHours=v('hours');
  const hRate=jikyu+(totalHours>0?fukuri/totalHours:0);
  const jinken=hRate*ihours;
  const genka=jinken+zairyo;
  const feeAmt=price*fee/100;
  const soUri=price-genka;
  const net=price-genka-feeAmt-haisou;
  const soR=price?soUri/price*100:0;
  const netR=price?net/price*100:0;
  const bep=(1-fee/100)>0?(genka+haisou)/(1-fee/100):0;
  const soBox=soR>=47?'ok':soR>=30?'warn':'bad';
  const netBox=net>=0?'ok':'bad';
  document.getElementById('item-result').innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-title goods">原価明細</div>
      <div class="pl-row total"><span>販売価格</span><div class="pl-right"><span>${yen(price)}</span><span class="pl-pct">100%</span></div></div>
      <div class="pl-row indent"><span>材料費</span><div class="pl-right"><span>${yen(zairyo)}</span><span class="pl-pct">${pct(zairyo,price)}</span></div></div>
      <div class="pl-row indent"><span>人件費（${ihours}h × ¥${Math.round(hRate).toLocaleString()}）</span><div class="pl-right"><span>${yen(jinken)}</span><span class="pl-pct">${pct(jinken,price)}</span></div></div>
      <hr class="div">
      <div class="pl-row total"><span>製造原価</span><div class="pl-right"><span>${yen(genka)}</span><span class="pl-pct">${pct(genka,price)}</span></div></div>
      <div class="pl-row indent"><span>マルシェ手数料（${fee}%）</span><span>▲ ${yen(feeAmt)}</span></div>
      <div class="pl-row indent"><span>配送費</span><span>▲ ${yen(haisou)}</span></div>
    </div>
    <div class="g2">
      <div class="result-box ${soBox}">
        <div>
          <div class="result-label">粗利</div>
          <div style="font-size:11px;opacity:0.8;margin-top:1px">${soR.toFixed(1)}%</div>
        </div>
        <div class="result-val">${yen(soUri)}</div>
      </div>
      <div class="result-box ${netBox}">
        <div>
          <div class="result-label">手取り利益</div>
          <div style="font-size:11px;opacity:0.8;margin-top:1px">${netR.toFixed(1)}%</div>
        </div>
        <div class="result-val">${yen(net)}</div>
      </div>
    </div>
    <div class="g2" style="margin-top:10px">
      <div class="mcard">
        <div class="mcard-label">損益分岐 販売価格</div>
        <div class="mcard-val" style="font-size:17px">${yen(bep)}</div>
        <div class="mcard-sub">この値段以上なら黒字</div>
      </div>
      <div class="mcard">
        <div class="mcard-label">この商品の実質時給</div>
        <div class="mcard-val" style="font-size:17px">${ihours>0?yen(net/ihours)+'/h':'—'}</div>
      </div>
    </div>
  `;
}

calc(); calcProj(); calcItem();
</script>
