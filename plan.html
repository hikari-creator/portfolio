<style>
.metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; text-align: center; }
.metric-label { font-size: 12px; color: var(--color-text-secondary); margin: 0 0 4px; }
.metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); margin: 0; }
.metric-sub { font-size: 11px; color: var(--color-text-tertiary); margin: 4px 0 0; }
.slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.slider-label { font-size: 13px; color: var(--color-text-secondary); width: 100px; flex-shrink: 0; }
.slider-val { font-size: 13px; font-weight: 500; color: var(--color-text-primary); width: 72px; text-align: right; flex-shrink: 0; }
</style>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 1.5rem;">
  <div class="metric"><p class="metric-label">月売上目標</p><p class="metric-value" id="m-sales">100万円</p></div>
  <div class="metric"><p class="metric-label">月経費・税金</p><p class="metric-value" id="m-cost">35万円</p><p class="metric-sub">売上の35%想定</p></div>
  <div class="metric"><p class="metric-label">月手取り</p><p class="metric-value" id="m-take">65万円</p></div>
  <div class="metric"><p class="metric-label">月貯蓄額</p><p class="metric-value" id="m-save">50万円</p><p class="metric-sub">手取りの77%</p></div>
</div>

<div style="margin-bottom: 1.5rem;">
  <div class="slider-row">
    <span class="slider-label">月売上</span>
    <input type="range" min="50" max="200" value="100" step="5" id="sl-sales" style="flex:1" oninput="recalc()">
    <span class="slider-val" id="lbl-sales">100万円</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">経費率（税込）</span>
    <input type="range" min="30" max="70" value="35" step="1" id="sl-cost" style="flex:1" oninput="recalc()">
    <span class="slider-val" id="lbl-cost">35%</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">生活費</span>
    <input type="range" min="10" max="30" value="15" step="1" id="sl-life" style="flex:1" oninput="recalc()">
    <span class="slider-val" id="lbl-life">15万円</span>
  </div>
</div>

<div style="position: relative; width: 100%; height: 260px; margin-bottom: 0.5rem;">
  <canvas id="chart"></canvas>
</div>
<div style="display: flex; gap: 20px; font-size: 12px; color: var(--color-text-secondary); margin-top: 6px;">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75;display:inline-block"></span>累積貯蓄</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:3px;background:#D85A30;display:inline-block"></span>目標1,000万円</span>
</div>
<p id="reach-msg" style="margin: 10px 0 0; font-size: 13px; color: var(--color-text-secondary);"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let myChart = null;

function recalc() {
  const sales = parseInt(document.getElementById('sl-sales').value);
  const costRate = parseInt(document.getElementById('sl-cost').value) / 100;
  const life = parseInt(document.getElementById('sl-life').value);

  document.getElementById('lbl-sales').textContent = sales + '万円';
  document.getElementById('lbl-cost').textContent = (costRate * 100).toFixed(0) + '%';
  document.getElementById('lbl-life').textContent = life + '万円';

  const cost = Math.round(sales * costRate);
  const take = sales - cost;
  const save = take - life;

  document.getElementById('m-sales').textContent = sales + '万円';
  document.getElementById('m-cost').textContent = cost + '万円';
  document.getElementById('m-cost').nextElementSibling.textContent = '売上の' + (costRate * 100).toFixed(0) + '%想定';
  document.getElementById('m-take').textContent = take + '万円';
  document.getElementById('m-save').textContent = save + '万円';
  document.getElementById('m-save').nextElementSibling.textContent = '手取りの' + Math.round(save/take*100) + '%';

  const labels = [];
  const data = [];
  const months = 36;
  let goal = 1000;
  let reachMonth = null;

  for (let m = 1; m <= months; m++) {
    const yr = Math.ceil(m / 12);
    const mo = m % 12 === 0 ? 12 : m % 12;
    labels.push(yr + '年' + mo + 'M');
    const cum = save * m;
    data.push(cum);
    if (cum >= goal && reachMonth === null) reachMonth = m;
  }

  const msg = reachMonth
    ? reachMonth + 'ヶ月目（' + Math.ceil(reachMonth/12) + '年' + (reachMonth%12===0?12:reachMonth%12) + 'ヶ月後）に1,000万円達成見込み'
    : '3年間では1,000万円に届かない試算です。売上アップか経費削減を検討を';
  document.getElementById('reach-msg').textContent = msg;

  const tealColor = '#1D9E75';
  const coralColor = '#D85A30';

  if (myChart) {
    myChart.data.labels = labels;
    myChart.data.datasets[0].data = data;
    myChart.data.datasets[0].backgroundColor = data.map(v => v >= goal ? '#0F6E56' : tealColor);
    myChart.data.datasets = myChart.data.datasets.filter(d => d.label !== 'goal-line');
    myChart.data.datasets.push({
      label: 'goal-line',
      type: 'line',
      data: Array(months).fill(goal),
      borderColor: coralColor,
      borderWidth: 1.5,
      borderDash: [5, 4],
      pointRadius: 0,
      fill: false
    });
    myChart.update();
  } else {
    myChart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: '累積貯蓄（万円）',
            data,
            backgroundColor: data.map(v => v >= goal ? '#0F6E56' : tealColor),
            borderRadius: 2,
            borderSkipped: false
          },
          {
            label: 'goal-line',
            type: 'line',
            data: Array(months).fill(goal),
            borderColor: coralColor,
            borderWidth: 1.5,
            borderDash: [5, 4],
            pointRadius: 0,
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => '累積: ' + ctx.parsed.y + '万円'
            }
          }
        },
        scales: {
          x: {
            ticks: {
              maxTicksLimit: 12,
              font: { size: 10 },
              color: '#888780'
            },
            grid: { display: false }
          },
          y: {
            ticks: {
              font: { size: 11 },
              color: '#888780',
              callback: v => v + '万'
            },
            grid: { color: 'rgba(136,135,128,0.15)' }
          }
        }
      }
    });
  }
}

recalc();
</script>
